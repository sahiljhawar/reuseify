repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.78
    hooks:
      - id: ty
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.10
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: reuseify-lint
        name: reuseify lint
        description: Check REUSE license compliance for git-tracked files using reuseify.
        entry: reuseify lint
        language: system
        pass_filenames: false
        always_run: true
