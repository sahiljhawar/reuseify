target-version = "py311"
line-length = 100
src = ["src"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[format]
quote-style = "double"
indent-style = "space"
